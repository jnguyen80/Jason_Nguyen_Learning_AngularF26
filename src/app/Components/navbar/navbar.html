<nav xmlns="http://www.w3.org/1999/html">
  <a routerLink="/monkeys">Monkeys</a>

  <button (click)="guardSettings.toggle()">
    {{ guardSettings.guardEnabled() ? 'Unlock Editing' : 'Lock Editing' }}
  </button>

  <span>Editing is {{ guardSettings.guardEnabled() ? 'locked' : 'unlocked' }}</span>

  <a routerLink="/saved">Saved ({{ saved.savedIds().length }})</a>

  <button (click)="prefs.toggleDark()">
    {{ prefs.dark() ? 'Light mode' : 'Dark mode' }}
  </button>

  @if (loading.isLoading()) {
    <span>Loading...</span>
  }
</nav>
